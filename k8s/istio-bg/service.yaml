# Base service — Harness BG PrepareAction clones this into nginx-svc-stable and nginx-svc-stage.
# For local testing, the -stable and -stage variants are created manually below.
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  namespace: istio-bg
  labels:
    app: nginx-bg
spec:
  selector:
    app: nginx-bg
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
# Stable variant — Harness manages this; included here for local testing only
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc-stable
  namespace: istio-bg
  labels:
    app: nginx-bg
    harness.io/color: blue
spec:
  selector:
    app: nginx-bg
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
---
# Stage variant — Harness manages this; included here for local testing only
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc-stage
  namespace: istio-bg
  labels:
    app: nginx-bg
    harness.io/color: green
spec:
  selector:
    app: nginx-bg
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP

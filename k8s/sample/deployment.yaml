apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
  labels:
    app: myapp
    type: front-end
    release-revision: "{{ .Values.releaseRevision }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      type: front-end
  template:
    metadata:
      name: myapp-pod
      labels:
        app: myapp
        type: front-end
        release-revision: "{{ .Values.releaseRevision }}"
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: nginx-container
          image: {{ .Values.image }}

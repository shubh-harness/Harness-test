service: my-serverless-app
frameworkVersion: '3'

provider:
  name: aws
  runtime: java11
  stage: dev
  region: us-east-1
  memorySize: 512
  timeout: 30
  environment:
    APP_ENV: dev

# package:
#   artifact: <+artifact.path>

functions:
  currentTime:
    handler: com.serverless.Handler
    # To use container image instead of artifact zip, uncomment below and comment out package.artifact above
    # image: <+artifact.image>
    events:
      - httpApi:
          path: /time
          method: get
  healthCheck:
    handler: com.serverless.HealthHandler
    events:
      - httpApi:
          path: /health
          method: get

plugins:
  - serverless-manifest-plugin
